<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finanzas en pareja — Entrar</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💗</text></svg>">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
  :root {
    --bg: #FAF7F8; --surface: #FFFFFF; --border: rgba(60,35,50,0.09);
    --text: #241820; --text-soft: #6E5A66; --text-faint: #A794A0;
    --accent: #C13E74; --accent-strong: #96285A; --accent-soft: #FBE4EE;
    --danger: #C6435F; --danger-soft: #FBE6EA;
    --shadow-md: 0 16px 32px -16px rgba(36,24,32,0.22), 0 4px 12px -4px rgba(36,24,32,0.08);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: 'Plus Jakarta Sans', -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text); padding: 20px;
  }
  .tarjeta {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: var(--shadow-md); padding: 32px 28px; width: 100%; max-width: 320px;
    text-align: center;
  }
  .marca-icono {
    width: 44px; height: 44px; border-radius: 10px; margin: 0 auto 14px;
    background: linear-gradient(155deg, var(--accent), var(--accent-strong));
    display: flex; align-items: center; justify-content: center; color: #fff;
  }
  h1 { font-family: 'Space Grotesk', sans-serif; font-size: 1.25rem; margin: 0 0 4px; }
  p.sub { color: var(--text-faint); font-size: 0.85rem; margin: 0 0 22px; }
  input {
    width: 100%; font-size: 0.95rem; padding: 11px 14px; border-radius: 10px;
    border: 1.5px solid var(--border); background: var(--bg); color: var(--text);
    text-align: center; letter-spacing: 0.05em;
  }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  button {
    width: 100%; margin-top: 12px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700;
    border: none; border-radius: 10px; padding: 11px 14px; cursor: pointer; font-size: 0.9rem;
    background: linear-gradient(155deg, var(--accent), var(--accent-strong)); color: #fff;
    transition: transform 0.15s var(--ease);
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.6; cursor: default; }
  .error {
    margin-top: 12px; font-size: 0.82rem; color: var(--danger); background: var(--danger-soft);
    border-radius: 8px; padding: 8px 10px; display: none;
  }
  .error.visible { display: block; }
</style>
</head>
<body>
<form class="tarjeta" id="form-login" autocomplete="off">
  <div class="marca-icono">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 21s-6.7-4.35-9.3-8.2C.9 9.8 1.6 6.6 4.3 5.6c2-.75 4.1.1 5.1 1.9.2.35.4.7.6 1 .2-.3.4-.65.6-1 1-1.8 3.1-2.65 5.1-1.9 2.7 1 3.4 4.2 1.6 7.2C18.7 16.65 12 21 12 21Z"/>
    </svg>
  </div>
  <h1>Finanzas en pareja</h1>
  <p class="sub">Este panel es solo para ustedes dos</p>
  <input type="password" id="password" placeholder="Contraseña" autofocus required>
  <button type="submit" id="btn-entrar">Entrar</button>
  <div class="error" id="error"></div>
</form>
<script>
  const form = document.getElementById('form-login');
  const boton = document.getElementById('btn-entrar');
  const error = document.getElementById('error');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    error.classList.remove('visible');
    boton.disabled = true;
    boton.textContent = 'Entrando...';
    try {
      const resp = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('password').value })
      });
      const datos = await resp.json();
      if (!resp.ok) throw new Error(datos.error || 'No se pudo entrar');
      const destino = new URLSearchParams(location.search).get('volver') || '/';
      location.href = destino;
    } catch (err) {
      error.textContent = err.message;
      error.classList.add('visible');
      boton.disabled = false;
      boton.textContent = 'Entrar';
    }
  });
</script>
</body>
</html>
